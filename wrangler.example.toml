name = "apple-music-mcp"
main = "src/index.ts"
compatibility_date = "2026-06-20"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]
workers_dev = true
preview_urls = false

[secrets]
required = ["MCP_API_KEY", "SETUP_TOKEN", "OAUTH_CONSENT_TOKEN", "TOKEN_ENCRYPTION_KEY", "APPLE_TEAM_ID", "APPLE_KEY_ID", "APPLE_PRIVATE_KEY"]

[[kv_namespaces]]
binding = "OAUTH_KV"
id = "<YOUR_KV_NAMESPACE_ID>"

[triggers]
crons = ["*/5 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "apple-music-mcp"
database_id = "<YOUR_D1_DATABASE_ID>"
migrations_dir = "migrations"

[vars]
APPLE_STOREFRONT = "us"
APPLE_DEVELOPER_TOKEN_TTL_SECONDS = "3600"
AUDIT_RETENTION_DAYS = "90"
