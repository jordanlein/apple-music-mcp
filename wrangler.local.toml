name = "apple-music-mcp-local"
main = "src/index.ts"
compatibility_date = "2026-06-20"
compatibility_flags = ["nodejs_compat"]

[[kv_namespaces]]
binding = "OAUTH_KV"
id = "00000000000000000000000000000000"

[[d1_databases]]
binding = "DB"
database_name = "apple-music-mcp-local"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[vars]
APPLE_STOREFRONT = "us"
APPLE_DEVELOPER_TOKEN_TTL_SECONDS = "3600"
